<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/872251a738.js" crossorigin="anonymous"></script>
</head>
<body id="FlashCardWeb">
    <div class="insight_box">
        <i class="fa-solid fa-sun flipped" id="sun"></i>

        <i class="fa-solid fa-moon"></i>
    </div>
    
    <!-- heading, doesn't including the card word since it's a after element -->
    <h1 id="hed">FLASH</h1>

    <main>

        <!-- previous arrow -->
        <div class="prev_nxt">
            <i class="fa-solid fa-arrow-up" id="previous"></i>
        </div>
        
        <!-- card -->
        <div class="card Clickabkle">

            <div class="card-inner Show">
                <div class="front"><p>what's 9 + 10?</p></div>
                <div class="back flipped"><p>21!!!</p></div>
            </div>

            <div class="card-inner">
                <div class="front"><p>2+2</p></div>
                <div class="back flipped"><p>4</p></div>
            </div>

            <div class="card-inner">
                <div class="front"><p>how sexy am I?</p></div>
                <div class="back flipped"><p>very sexxyyy</p></div>
            </div>

        </div>

        <!-- after arrow -->
        <div class="prev_nxt">
            <i class="fa-solid fa-arrow-up" id="next"></i>
        </div>

    </main>


    <script src="app.js"></script>
</body>
</html>
